<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1b3a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c99a2e"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a56"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <rect width="1440" height="740" fill="url(#bg)"/>

  <!-- Title -->
  <text x="48" y="56" font-size="30" font-weight="700" fill="#0b1b3a">Black Duck AppSec kit for Docker Sandboxes</text>
  <text x="48" y="87" font-size="17" fill="#5b6472">A self-contained Detect SCA overlay that composes onto any sandboxed AI coding agent</text>

  <!-- ===== Developer host (outer boundary) ===== -->
  <rect x="40" y="118" width="1120" height="560" rx="20" fill="#eef2fb" stroke="#d3ddf2" stroke-width="1.5"/>
  <text x="62" y="150" font-size="15" font-weight="700" fill="#3a4a66" letter-spacing="1">DEVELOPER HOST</text>

  <!-- host services (left column) -->
  <rect x="56" y="200" width="210" height="86" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="76" y="234" font-size="18" font-weight="700" fill="#0b1b3a">sbx CLI</text>
  <text x="76" y="260" font-size="13" fill="#5b6472">composes + runs the kit</text>

  <rect x="56" y="310" width="210" height="86" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="76" y="344" font-size="18" font-weight="700" fill="#0b1b3a">Credential store</text>
  <text x="76" y="370" font-size="13" fill="#5b6472">service: blackduck</text>

  <!-- ===== Sandbox microVM (nested inside host) ===== -->
  <rect x="360" y="175" width="545" height="470" rx="16" fill="#e9f7f1" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="382" y="206" font-size="14.5" font-weight="700" fill="#1f7a56" letter-spacing="0.5">SANDBOX microVM  ·  composed kit image</text>

  <!-- workload -->
  <rect x="382" y="222" width="501" height="62" rx="12" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="402" y="250" font-size="18" font-weight="700" fill="#0b1b3a">v3 workload</text>
  <text x="402" y="271" font-size="13" fill="#5b6472">AI coding agent / shell</text>

  <!-- mixin overlay -->
  <rect x="382" y="298" width="501" height="248" rx="14" fill="#f6fffb" stroke="#39b587" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="402" y="324" font-size="14" font-weight="700" fill="#1f7a56" letter-spacing="0.5">blackduck-detect mixin  (overlay)</text>

  <rect x="402" y="336" width="461" height="52" rx="10" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="422" y="360" font-size="15" font-weight="700" fill="#0b1b3a">detect</text>
  <text x="422" y="378" font-size="12.5" fill="#5b6472">/usr/local/bin/detect launcher on PATH</text>

  <rect x="402" y="400" width="220" height="46" rx="10" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="420" y="420" font-size="14" font-weight="700" fill="#0b1b3a">detect.jar</text>
  <text x="420" y="438" font-size="12" fill="#5b6472">Detect 12.1.0</text>

  <rect x="643" y="400" width="220" height="46" rx="10" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="661" y="420" font-size="14" font-weight="700" fill="#0b1b3a">jre</text>
  <text x="661" y="438" font-size="12" fill="#5b6472">bundled Temurin 17</text>

  <rect x="402" y="460" width="461" height="42" rx="10" fill="#fff8ec" stroke="#f0cf8a" stroke-width="1.5"/>
  <text x="420" y="486" font-size="12.5" fill="#8a6d2f">env: BLACKDUCK_URL · BLACKDUCK_API_TOKEN (injected)</text>

  <!-- mounted workspace -->
  <rect x="382" y="562" width="501" height="62" rx="12" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="402" y="590" font-size="18" font-weight="700" fill="#0b1b3a">Mounted workspace</text>
  <text x="402" y="611" font-size="13" fill="#5b6472">your code to scan</text>

  <!-- ===== egress proxy at host boundary ===== -->
  <rect x="935" y="300" width="200" height="120" rx="14" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="955" y="336" font-size="16" font-weight="700" fill="#0b1b3a">Network policy</text>
  <text x="955" y="360" font-size="14" fill="#5b6472">+ egress proxy</text>
  <text x="955" y="390" font-size="12.5" fill="#8a93a3">allow: blackduckHost</text>

  <!-- ===== Black Duck server (outside host) ===== -->
  <rect x="1210" y="300" width="200" height="120" rx="18" fill="#0b1b3a" filter="url(#shadow)"/>
  <text x="1232" y="344" font-size="20" font-weight="700" fill="#ffffff">Black Duck</text>
  <text x="1232" y="372" font-size="15" fill="#aeb9cf">SCA server</text>
  <text x="1232" y="400" font-size="12" fill="#7f8aa3">risk: OSS · license · vuln</text>

  <!-- ===== Build / publish time (outside host) ===== -->
  <rect x="1210" y="470" width="200" height="150" rx="18" fill="#f4f6fb" stroke="#d3ddf2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1232" y="502" font-size="13" font-weight="700" fill="#5b6472" letter-spacing="0.3">BUILD / PUBLISH TIME</text>
  <text x="1232" y="532" font-size="12.5" fill="#5b6472">repo.blackduck.com</text>
  <text x="1242" y="551" font-size="12.5" fill="#8a93a3">→ detect.jar</text>
  <text x="1232" y="580" font-size="12.5" fill="#5b6472">api.adoptium.net</text>
  <text x="1242" y="599" font-size="12.5" fill="#8a93a3">→ Temurin JRE</text>

  <!-- ===== Arrows ===== -->
  <!-- sbx composes/runs the microVM -->
  <path d="M266,242 L357,238" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="226" font-size="12.5" fill="#5b6472">compose + run</text>

  <!-- credential injects token into env -->
  <path d="M266,353 C 324,372 344,480 400,483" fill="none" stroke="#c99a2e" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="274" y="406" font-size="12.5" fill="#c99a2e">inject token</text>

  <!-- detect scans workspace -->
  <path d="M414,388 C 388,460 388,522 400,558" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="364" y="492" font-size="12.5" fill="#5b6472">scan</text>

  <!-- microVM egress -> proxy -->
  <path d="M905,360 L931,360" fill="none" stroke="#1f7a56" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="893" y="350" font-size="12.5" fill="#1f7a56">HTTPS</text>

  <!-- proxy -> Black Duck (leaves host) -->
  <path d="M1135,360 L1206,360" fill="none" stroke="#1f7a56" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- build/publish bundled into overlay (dashed) -->
  <path d="M1206,545 C 1050,545 950,500 886,480" fill="none" stroke="#9aa3b2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="958" y="540" font-size="12" fill="#9aa3b2">bundled at build</text>
</svg>
