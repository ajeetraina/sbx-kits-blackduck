<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b1b3a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="48" y="58" font-size="30" font-weight="700" fill="#0b1b3a">Black Duck AppSec kit for Docker Sandboxes</text>
  <text x="48" y="88" font-size="17" fill="#5b6472">A self-contained Detect SCA overlay that composes onto any sandboxed AI coding agent</text>

  <!-- ===== Lane: Developer host ===== -->
  <rect x="48" y="130" width="300" height="470" rx="18" fill="#eef2fb" stroke="#d3ddf2" stroke-width="1.5"/>
  <text x="68" y="166" font-size="15" font-weight="700" fill="#3a4a66" letter-spacing="1">DEVELOPER HOST</text>

  <rect x="72" y="190" width="252" height="86" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="222" font-size="18" font-weight="700" fill="#0b1b3a">sbx CLI</text>
  <text x="90" y="248" font-size="14" fill="#5b6472">composes + runs the kit image</text>

  <rect x="72" y="296" width="252" height="86" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="328" font-size="18" font-weight="700" fill="#0b1b3a">Credential store</text>
  <text x="90" y="354" font-size="14" fill="#5b6472">service: blackduck</text>

  <rect x="72" y="402" width="252" height="100" rx="12" fill="#ffffff" stroke="#c7d2ea" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="434" font-size="18" font-weight="700" fill="#0b1b3a">Network policy</text>
  <text x="90" y="460" font-size="14" fill="#5b6472">+ egress proxy</text>
  <text x="90" y="482" font-size="13" fill="#8a93a3">allow: blackduckHost only</text>

  <!-- ===== Lane: Sandbox microVM ===== -->
  <rect x="408" y="130" width="470" height="470" rx="18" fill="#e9f7f1" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="430" y="166" font-size="15" font-weight="700" fill="#1f7a56" letter-spacing="1">SANDBOX microVM  ·  composed kit image</text>

  <!-- workload -->
  <rect x="432" y="190" width="422" height="70" rx="12" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="452" y="222" font-size="18" font-weight="700" fill="#0b1b3a">v3 workload</text>
  <text x="452" y="244" font-size="14" fill="#5b6472">AI coding agent / shell</text>

  <!-- mixin overlay box -->
  <rect x="432" y="276" width="422" height="214" rx="14" fill="#f6fffb" stroke="#39b587" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="452" y="304" font-size="14" font-weight="700" fill="#1f7a56" letter-spacing="0.5">blackduck-detect mixin  (overlay)</text>

  <rect x="452" y="318" width="382" height="54" rx="10" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="470" y="340" font-size="15" font-weight="700" fill="#0b1b3a">detect</text>
  <text x="470" y="360" font-size="13" fill="#5b6472">/usr/local/bin/detect launcher on PATH</text>

  <rect x="452" y="382" width="184" height="46" rx="10" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="468" y="402" font-size="14" font-weight="700" fill="#0b1b3a">detect.jar</text>
  <text x="468" y="420" font-size="12" fill="#5b6472">Detect 12.1.0</text>

  <rect x="650" y="382" width="184" height="46" rx="10" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="666" y="402" font-size="14" font-weight="700" fill="#0b1b3a">jre</text>
  <text x="666" y="420" font-size="12" fill="#5b6472">bundled Temurin 17</text>

  <rect x="452" y="436" width="382" height="42" rx="10" fill="#fff8ec" stroke="#f0cf8a" stroke-width="1.5"/>
  <text x="470" y="462" font-size="13" fill="#8a6d2f">env: BLACKDUCK_URL · BLACKDUCK_API_TOKEN (injected)</text>

  <!-- mounted workspace -->
  <rect x="432" y="506" width="422" height="70" rx="12" fill="#ffffff" stroke="#bfe6d6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="452" y="538" font-size="18" font-weight="700" fill="#0b1b3a">Mounted workspace</text>
  <text x="452" y="560" font-size="14" fill="#5b6472">your code to scan</text>

  <!-- ===== Black Duck server ===== -->
  <rect x="938" y="300" width="294" height="130" rx="18" fill="#0b1b3a" filter="url(#shadow)"/>
  <text x="962" y="344" font-size="20" font-weight="700" fill="#ffffff">Black Duck</text>
  <text x="962" y="370" font-size="16" fill="#aeb9cf">SCA server</text>
  <text x="962" y="400" font-size="13" fill="#7f8aa3">open-source · license · vuln risk</text>

  <!-- ===== Build / publish time ===== -->
  <rect x="938" y="470" width="294" height="130" rx="18" fill="#f4f6fb" stroke="#d3ddf2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="962" y="502" font-size="14" font-weight="700" fill="#5b6472" letter-spacing="0.5">BUILD / PUBLISH TIME</text>
  <text x="962" y="532" font-size="14" fill="#5b6472">repo.blackduck.com → detect.jar</text>
  <text x="962" y="558" font-size="14" fill="#5b6472">api.adoptium.net → Temurin JRE</text>
  <text x="962" y="584" font-size="12.5" fill="#8a93a3">bundled into the overlay at build</text>

  <!-- ===== Arrows ===== -->
  <!-- sbx composes/runs VM -->
  <path d="M324 233 L404 215" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="334" y="206" font-size="12.5" fill="#5b6472">compose + run</text>

  <!-- credential inject token -->
  <path d="M324 339 C 380 339, 400 452, 450 457" fill="none" stroke="#c99a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="372" font-size="12.5" fill="#c99a2e">inject token</text>

  <!-- detect scans workspace -->
  <path d="M470 372 C 440 420, 440 490, 470 524" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="452" font-size="12.5" fill="#5b6472">scan</text>

  <!-- mixin HTTPS -> proxy -> Black Duck. Represent egress via proxy to server -->
  <path d="M636 345 C 760 345, 780 365, 936 365" fill="none" stroke="#1f7a56" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="712" y="336" font-size="12.5" fill="#1f7a56">HTTPS via egress proxy</text>

  <!-- build-time bundling arrows (dashed) -->
  <path d="M936 520 C 900 500, 880 440, 838 410" fill="none" stroke="#9aa3b2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="846" y="500" font-size="12" fill="#9aa3b2">bundled at build</text>
</svg>
