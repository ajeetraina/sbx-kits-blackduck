# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Black Duck Bridge
description: >-
  Black Duck Bridge CLI, the unified orchestrator for Black Duck security scans
  (Black Duck SCA, Coverity, Polaris, SRM). Bundled as the self-contained
  "bundle" flavour - it ships its own JRE and stage adapters - so the overlay
  runs on any agent workload and drops `bridge-cli` on PATH, defaulting to a
  Black Duck SCA scan against your server.
sourceUrl: https://documentation.blackduck.com/bundle/bridge/page/documentation/c_overview.html
# Bridge CLI is distributed under Black Duck's commercial EULA, not an OSI license.
licenses: [LicenseRef-BlackDuck-Commercial]

# One value drives the install URL, the provide and the published version/tag.
version: "${{ kit.args.version }}"

args:
  version:
    default: "4.6.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Bridge CLI bundle release to bundle (served from repo.blackduck.com)
    buildArg: BRIDGE_VERSION

  # The Black Duck server host is baked into the egress policy, so it must be
  # known at build/compose time. Override this for your instance, e.g.
  #   sbx run ./workload --kit ./blackduck-bridge --kit-arg blackduck-bridge.blackduckHost=bd.acme.com .
  blackduckHost:
    default: "blackduck.example.com"
    pattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$'
    description: Hostname of your Black Duck SCA server, used for BRIDGE_BLACKDUCKSCA_URL and the runtime egress allow-list
    buildArg: BLACKDUCK_HOST

provides: ["blackduck-bridge@${{ kit.args.version }}"]

# No requires: the bundle ships its own JRE and adapters, so it needs nothing
# from the base beyond the §12 platform floor (sh, a CA store). Do NOT add
# deb/openjdk here - it would refuse every Alpine/distroless/Wolfi workload that
# the self-contained bundle runs on perfectly well. The silence is deliberate.

capabilities:
  # Build reaches the bundle repo; the running agent reaches only the customer's
  # Black Duck server. The "bundle" flavour performs no tool download at scan
  # time, so runtime needs no repo.blackduck.com access. network-policy is
  # phase-scoped - an absent phase grants nothing.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - repo.blackduck.com          # bridge-cli-bundle-<version>-<arch>.zip
      runtime:
        allow:
          - "${{ kit.args.blackduckHost }}"

  # Bridge authenticates to the server itself (api-token -> session), so the
  # real token must live in the container as a plain env var. It is NOT
  # proxy-managed: forcing an Authorization header on every request to the host
  # would clobber Bridge's token-authenticated calls. Populate the `blackduck`
  # credential in your host store before composing. The default env var targets
  # the Black Duck SCA stage; other stages read their own vars (see context).
  - type: com.docker.sandbox/credential@1
    config:
      service: blackduck
      phase: runtime
      apiKey:
        name: BRIDGE_BLACKDUCKSCA_TOKEN

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./blackduck-bridge-context.md
